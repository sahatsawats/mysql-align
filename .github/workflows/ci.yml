name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: vet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run integration tests
        run: bash scripts/test-integration.sh

  build:
    name: Build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binary
        run: |
          VERSION=$(grep -oP 'const version = "\K[^"]+' main.go)
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o "build/myalign-${VERSION}${{ matrix.ext }}" .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myalign-${{ matrix.goos }}-amd64
          path: build/myalign-*
          retention-days: 30
