name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: vet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run integration tests
        run: bash scripts/test-integration.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Windows binary
        run: |
          VERSION=$(grep -oP 'const version = "\K[^"]+' main.go)
          GOOS=windows GOARCH=amd64 go build -o "build/myalign-test-${VERSION}.exe" .
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: myalign-windows-amd64
          path: build/myalign-test-*.exe
          retention-days: 30
